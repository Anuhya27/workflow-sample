name: Example Workflow
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          repository: Anuhya27/workflow_sample  # Ensure this is correct
          token: ${{ secrets.ACTION_TOKEN }}  # Use PAT for private repos
          ref: "test"

      - name: List Files
        run: ls -la

      - name: Run Sample Script
        run: |
          echo "Running with input..."
          chmod +x test_run.sh  # Ensure test_run.sh exists and is executable
          ./test_run.sh         # Execute the script