name: "Terraform and Job Definition Update"

on:
  push:
    branches:
      - main
      - test

jobs:
    terraform:
      name: "Terraform"
      runs-on: ubuntu-latest
      environment: ${{ github.ref_name }}

      defaults:
        run:
          shell: bash
          working-directory: ./terraform
    
      env:
        AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
        AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        AWS_REGION: ${{secrets.AWS_REGION}}
        RESOURCE_NAME: ${{vars.JOB_DEFINITION}}
      steps:
        - name: Checkout
          uses: actions/checkout@v2

        - name: Install Terraform
          run: |
            echo $environment
            wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
            sudo apt update && sudo apt install terraform
        
        # - name: Set AWS Region
        #   run: echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
  
        - name: Terraform Init
          env:
            JOB_DEFINITION: 
          run: |
            terraform init 
            terraform plan -input=false -var="JOB_DEFINITION=${{vars.JOB_DEFINITION}}"
            terraform apply -auto-approve -var="JOB_DEFINITION=${{vars.JOB_DEFINITION}}"

        # - name: Terraform Plan
        #   run: |
        #     terraform plan -input=false

        - name: Terraform Plan
          run: echo $RESOURCE_NAME
    #     - name: Terraform Apply
    #       run: |
    #         terraform apply -auto-approve -input=false

    ecr_image_update:
      name: "ECR Image Update"
      runs-on: ubuntu-latest
      needs: terraform
      environment: ${{github.ref_name}}

      # env:
      #   AWS_REGION: ${{secrets.AWS_REGION}}
      #   AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
      #   AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
      steps:

        - name: Checkout
          uses: actions/checkout@v2
        # - name: Set AWS Region
        #   run: echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
 
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v1
          with:
            aws-access-key-id: ${{env.AWS_ACCESS_KEY_ID}}
            aws-secret-access-key: ${{env.AWS_SECRET_ACCESS_KEY }}
            aws-region:  ${{secrets.AWS_REGION}}
  
        # - name: Set up environment
        #   run: echo "ECR_IMAGE_TAG=$(cat env | grep ECR_IMAGE_TAG | cut -d'=' -f2)" >> $GITHUB_ENV

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Push-ECR
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            REPOSITORY: ${{ vars.JOB_DEFINITION }}
            IMAGE_TAG: ${{ env.ECR_IMAGE_TAG }}
          run: |
            docker build --build-arg JOB_DEFINITION=$RESOURCE_NAME -t $REGISTRY/$REPOSITORY:$IMAGE_TAG . 
            docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
            echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

    job_definition_update:
      name: "Job Definition Update"
      runs-on: ubuntu-latest
      needs: [terraform, ecr_image_update]
      environment: ${{github.ref_name}}

      defaults:
        run:
          shell: bash
          working-directory: ./terraform

      steps:
        - name: Checkout
          uses: actions/checkout@v2

        # - name: Configure AWS credentials
        #   run: |
        #     aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }} 
        #     aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
        #     aws configure set region ${{ secrets.AWS_REGION }}
      #     - name: Configure AWS credentials
     
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v1
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} 
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}
  
        - name: Execute Job Definition Update Script
          run: |
            chmod +x update_job_definition.sh
            ./update_job_definition.sh
