name: Reusable Workflow
on:
  workflow_call:
    secrets:
      token:
        required: true
    inputs:
      input1:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          repository: Anuhya27/workflow-sample  # Ensure this is correct
          token: ${{ secrets.token }}  # Use PAT for private repos
          ref: "test"
  
      - name: List files
        run: ls -la

      - name: pwd
        run: pwd

      - name: Run sample script
        run: |
            echo "Running with input: ${{ inputs.input1 }}"
            chmod +x test_run.sh
            ./test_run.sh

