name: Reusable Workflow
on:
  workflow_call:
    inputs:
      input1:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v2

      - name: List files
        run: ls -la
        
      - name: Run sample script
        run: |
            echo "Running with input: ${{ inputs.input1 }}"
            chmod +x test_run.sh
            ./test_run.sh